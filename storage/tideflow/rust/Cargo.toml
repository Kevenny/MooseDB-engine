[workspace]
resolver = "2"
members = ["tideflow-core", "tideflow-ffi", "tideflow-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-only"
authors = ["Kevenny / Rech Informática"]

[workspace.dependencies]
tideflow-core = { path = "tideflow-core" }
crc32fast = "1.4"
tempfile = "3"

[profile.release]
# Panics must unwind so the FFI layer can catch them instead of
# aborting the whole mysqld process.
panic = "unwind"
debug = "line-tables-only"
