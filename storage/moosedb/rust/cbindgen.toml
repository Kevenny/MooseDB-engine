language = "C"
cpp_compat = true
pragma_once = true
include_version = false
autogen_warning = """
/*
 * moosedb_ffi.h — C API of the MooseDB storage core (Rust).
 * Generated by cbindgen from rust/moosedb-ffi/src/lib.rs. DO NOT EDIT.
 * Regenerate with: cbindgen --config rust/cbindgen.toml --output moosedb_ffi.h rust/moosedb-ffi
 */"""
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
documentation = true
documentation_style = "c99"
style = "type"

[export]
include = ["TFColumnType"]

[enum]
rename_variants = "None"
prefix_with_name = false

[parse]
parse_deps = false
